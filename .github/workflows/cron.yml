name: Cron

# Ruft die Cron-Endpunkte der Live-Seite auf (Drop-Alarm zum Verkaufsstart, Warteliste,
# Feedback, später Aufräumen). GitHub startet geplante Läufe teils mit einigen
# Minuten Verzögerung. Bei einem Wechsel zu Vercel Pro übernimmt vercel.json die Aufgabe.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL || 'https://pizza-drop-store.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Drop-Alarm
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET fehlt"
            exit 1
          fi
          # Kurzer Aussetzer (Deploy, Netz): bis zu 3 Wiederholungen. Ein 503 der App
          # (z. B. Resend-Schlüssel fehlt) bleibt danach rot: GitHub mailt bei Fehlschlag.
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/drop-alarm"
      - name: Warteliste
        # Läuft auch, wenn der Drop-Alarm rot war: beide sind unabhängig.
        if: ${{ !cancelled() && env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/warteliste"
      - name: Feedback
        if: ${{ !cancelled() && env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/feedback"
