name: Lockfile erneuern

# Ein unter Windows erzeugtes package-lock.json lässt plattformabhängige optionale Pakete
# weg (z. B. @emnapi/*); `npm ci` in der Linux-CI bricht dann ab. Dieser Workflow erzeugt
# das Lockfile unter Linux neu und stellt es als Download bereit. Nach jeder Änderung an
# den Abhängigkeiten von Hand starten, herunterladen, prüfen und committen:
#   gh workflow run lockfile.yml
#   gh run download --name package-lock
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lockfile unter Linux neu auflösen
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prüfen, dass npm ci damit durchläuft
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
